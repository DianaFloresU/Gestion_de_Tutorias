<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Estudiante</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0b132b; 
            color: #ffffff;
        }
        
        header {
            background-color: #1c2541; 
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a506b;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }

        header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-logout {
            padding: 8px 16px;
            background-color: #e63946; 
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #c1121f;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Menú Izquierdo (1/4 de la pantalla o ~25%) */
        nav {
            width: 25%;
            background-color: #1c2541;
            border-right: 1px solid #3a506b;
            padding: 25px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            background-color: #0b132b;
            color: #a2a8d3;
            border: 1px solid #3a506b;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav button:hover {
            border-color: #00b4d8;
            color: #ffffff;
        }

        nav button.active {
            background-color: #0077b6; /* Azul eléctrico de tu captura */
            color: #ffffff;
            border-color: #00b4d8;
            box-shadow: 0px 4px 10px rgba(0, 119, 182, 0.3);
        }

        /* Zona de Contenido Derecha (3/4 de la pantalla) */
        main {
            width: 75%;
            padding: 40px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .content-section {
            display: none;
            background: #1c2541;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #3a506b;
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.2);
        }

        .content-section.active {
            display: block;
        }

        .content-section h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            border-bottom: 2px solid #3a506b;
            padding-bottom: 10px;
            color: #00b4d8;
        }

        /* Formulario de Solicitudes */
        form {
            display: flex;
            flex-direction: column;
            max-width: 550px;
        }

        label {
            margin-top: 15px;
            font-weight: 600;
            color: #a2a8d3;
            font-size: 14px;
        }

        select, textarea, input {
            padding: 12px;
            margin-top: 6px;
            background-color: #0b132b;
            border: 1px solid #3a506b;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: #00b4d8;
        }

        .row-fechas {
            display: flex;
            gap: 15px;
        }

        .row-fechas div {
            flex: 1;
        }

        form button {
            margin-top: 30px;
            padding: 14px;
            background-color: #0077b6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        form button:hover {
            background-color: #0096c7;
        }

        /* Estilos de la Tabla de Tutorías */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #3a506b;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #0b132b;
            color: #00b4d8;
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(58, 80, 107, 0.2);
        }

        /* Marcadores de Estado Estilo Semáforo */
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Colores adaptados del contraste oscuro */
        .badge.pendiente { background-color: #ffb703; color: #023047; }   /* Amarillo alerta */
        .badge.programada { background-color: #2a9d8f; color: #ffffff; }  /* Verde azulado */
        .badge.realizada { background-color: #06d6a0; color: #023047; }   /* Verde brillante */
        .badge.cancelada { background-color: #e63946; color: #ffffff; }   /* Rojo */
    </style>
    <script>
        // Guardián de seguridad: Si no hay token, rebota al login
        if (!localStorage.getItem("token")) {
            window.location.replace("/");
        }
    </script>
</head>
<body>

    <header>
        <h2>Panel de Acompañamiento Académico</h2>
        <div>
            <span id="nombre-usuario" style="font-weight: 600; margin-right: 20px; color: #00b4d8;">Estudiante</span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="main-container">
        <nav>
            <button class="active" onclick="cambiarSeccion('solicitudes', this)">Solicitudes</button>
            <button onclick="cambiarSeccion('tutorias', this)">Tutorías</button>
        </nav>

        <main>
            <section id="solicitudes" class="content-section active">
                <h3>Solicitud de Tutoría</h3>
                <form id="form-solicitud" onsubmit="enviarSolicitud(event)">
                    <label for="asignatura">Asignatura</label>
                    <select id="asignatura" required>
                        <option value="">Selecciona una materia...</option>
                        <option value="Base de Datos I">Base de Datos I</option>
                        <option value="Programación II">Programación II</option>
                        <option value="Cálculo I">Cálculo I</option>
                        <option value="Redes de Computadoras">Redes de Computadoras</option>
                    </select>

                    <label for="descripcion">Descripción de tus dificultades</label>
                    <textarea id="descripcion" rows="4" placeholder="Describe detalladamente los temas o algoritmos que necesitas reforzar..." required></textarea>

                    <label>Rango de Fechas Disponibles</label>
                    <div class="row-fechas">
                        <div>
                            <span style="font-size: 12px; color: #a2a8d3;">Desde:</span>
                            <input type="date" id="fecha-inicio" required style="width: 100%;">
                        </div>
                        <div>
                            <span style="font-size: 12px; color: #a2a8d3;">Hasta:</span>
                            <input type="date" id="fecha-fin" required style="width: 100%;">
                        </div>
                    </div>

                    <button type="submit">Enviar Solicitud Académica</button>
                </form>
            </section>

            <section id="tutorias" class="content-section">
                <h3>Mis Tutorías y Estados</h3>
                <table style="margin-top: 20px;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Materia / Asignatura</th>
                            <th>Fecha y Hora</th>
                            <th>Aula / Enlace Virtual</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-tutorias-estudiante">
                        </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='estudiante.js') }}"></script>
</body>
</html>
